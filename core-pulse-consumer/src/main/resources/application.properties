server.port=8082

spring.application.name=core-pulse-consumer

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=core-pulse-aggregation
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer